<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Thoughtful travel stories, local favourites, and island escapes from nucleus." />
    <title>nucleus — stories worth travelling for</title>

    <script>
      (() => {
        let savedTheme = null;

        try {
          savedTheme = localStorage.getItem('nucleus-theme');
        } catch {
          // Fall back to the system preference when storage is unavailable.
        }

        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : prefersDark ? 'dark' : 'light';

        document.documentElement.dataset.theme = theme;

        const params = new URLSearchParams(window.location.search);
        const route = params.get('route');
        if (route) {
          const hash = params.get('hash') || '';
          window.history.replaceState(null, '', `${route}${hash}`);
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
